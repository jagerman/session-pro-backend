[uwsgi]
; uWSGI Emperor vassal for the Session Pro Backend.
;
; deploy.sh installs this to /etc/uwsgi-emperor/vassals/pro-backend.ini owned by the
; pro-backend user, so the tyrant Emperor (emperor-tyrant + cap=setgid,setuid) runs it as
; that unprivileged user. The Emperor itself is shared fleet infrastructure and is NOT
; managed by this project — deploy.sh only drops this vassal in.

plugin              = python3
; System Python (from the plugin) plus this project's venv on sys.path. The venv supplies the
; deps Debian doesn't ship adequately (sqlalchemy, the Apple/Google SDKs); flask, pynacl,
; psycopg2 and session_util come from system packages (the venv is built --system-site-packages).
virtualenv          = /opt/session-pro-backend/.venv
chdir               = /opt/session-pro-backend
module              = main:flask_app
env                 = SESH_PRO_BACKEND_INI_PATH=/etc/session-pro-backend/config.ini

master              = true
processes           = 4
; Threads MUST be enabled: the backend runs the DB-expiry and Google Pub/Sub worker threads.
enable-threads      = true
die-on-term         = true
strict              = true
need-app            = true
vacuum              = true

socket              = /run/pro-backend/pro-backend.sock
chmod-socket        = 660

harakiri            = 10
reload-mercy        = 5
worker-reload-mercy = 5
procname-prefix-spaced = sesh-pro-backend
logto               = /var/log/pro-backend/backend.log
