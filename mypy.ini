[mypy]
python_version = 3.13

# This codebase is only partially annotated, so DON'T demand annotations everywhere
# (that just produces "missing type annotation" noise). Instead, check the BODIES of
# unannotated functions too — that's where real call/arg/attr bugs hide (e.g. the
# add_user_error(unix_ts_ms=...) call that didn't match its param).
check_untyped_defs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Most third-party deps (nacl, psycopg, google, flask, werkzeug, appstoreserverlibrary)
# ship no type stubs; without this every import is an error and drowns the signal.
ignore_missing_imports = True

# Keep the focus on correctness findings, not annotation-hygiene nags.
warn_return_any = False
warn_unused_ignores = False
warn_redundant_casts = False
warn_no_return = False
no_implicit_optional = False

# The bundled third-party vendor tree isn't ours to lint.
exclude = (^|/)(vendor|\.venv)/
