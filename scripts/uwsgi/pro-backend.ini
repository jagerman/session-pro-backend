[uwsgi]
; uWSGI Emperor vassal for the Session Pro Backend.
;
; deploy.sh installs this to /etc/uwsgi-emperor/vassals/pro-backend.ini owned by the
; pro-backend user, so the tyrant Emperor (emperor-tyrant + cap=setgid,setuid) runs it as
; that unprivileged user. The Emperor itself is shared fleet infrastructure and is NOT
; managed by this project — deploy.sh only drops this vassal in.

plugin              = python3
; System Python (from the plugin) plus this project's venv on sys.path. The venv supplies the
; deps Debian doesn't ship adequately (sqlalchemy, the Apple/Google SDKs); flask, pynacl,
; psycopg2 and session_util come from system packages (the venv is built --system-site-packages).
virtualenv          = /opt/session-pro-backend/.venv
chdir               = /opt/session-pro-backend
module              = main:flask_app
; Two mules, both sharing this vassal so the whole deployment stays in one uWSGI config:
;   - the Google Pub/Sub notification subscriber, ONE consumer rather than per-worker (see
;     providers/google_play/mule.py). Another provider needing a consumer adds its own
;     `mule = providers.<provider>.mule:run`, so a stall in one can't hold up another.
;   - the maintenance loop: the periodic DB prune and the Apple notification catch-up (see
;     maintenance.py). A plain loop, not uWSGI timers, so it needs no signal registration and stays off
;     the request workers.
mule                = providers.google_play.mule:run
mule                = maintenance:run
env                 = SESH_PRO_BACKEND_INI_PATH=/etc/session-pro-backend/config.ini

master              = true
processes           = 4
; Threads MUST be enabled: the Google mule runs its Pub/Sub subscriber pull loop on a thread.
enable-threads      = true
die-on-term         = true
strict              = true
need-app            = true
vacuum              = true

socket              = /run/pro-backend/pro-backend.sock
chmod-socket        = 660

harakiri            = 10
reload-mercy        = 5
worker-reload-mercy = 5
procname-prefix-spaced = sesh-pro-backend
; Log to a file, rotated by uWSGI at maxsize -> renamed to log-backupname (one previous copy kept),
; no external logrotate. These are core options; the `file:` logger form would instead need the
; logfile plugin loaded (plugin = python3,logfile), which this build doesn't load by default.
logto               = /var/log/pro-backend/backend.log
log-maxsize         = 100000000
log-backupname      = /var/log/pro-backend/backend.log.old
; Drop per-request access-log spam but keep error responses. disable-logging turns off only the
; ordinary access logging; 4xx/5xx responses, app logging, and uWSGI's own messages still log.
disable-logging     = true
log-4xx             = true
log-5xx             = true
